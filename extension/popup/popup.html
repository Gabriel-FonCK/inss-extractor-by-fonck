<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>INSS Extractor by FonCK</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #edf0f5;
      --ink: #101218;
      --muted: #555b69;
      --line: rgba(16, 18, 24, 0.12);
      --accent: #2456d6;
      --pri-bg: #101218;
      --pri-fg: #f6f7f9;
      --pri-hover: #252936;
    }
    html[data-theme="dark"] {
      --bg: #0a0b0f;
      --surface: #12141b;
      --surface-2: #1a1d27;
      --ink: #f3f5fa;
      --muted: #9ca3b5;
      --line: rgba(243, 245, 250, 0.1);
      --accent: #5e8bff;
      --pri-bg: #f3f5fa;
      --pri-fg: #0a0b0f;
      --pri-hover: #dde3f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      width: 316px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.48;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .brand { display: flex; flex-direction: column; gap: 1px; }
    .eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .brand b {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
      flex: none;
    }
    .theme-btn:hover { border-color: var(--ink); }
    p { margin: 0 0 12px; color: var(--muted); font-size: 12.2px; }
    .actions { display: grid; gap: 7px; }
    button.btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--ink);
      background: var(--pri-bg);
      color: var(--pri-fg);
      font-weight: 600;
      font-size: 12.8px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    button.btn:hover { background: var(--pri-hover); }
    button.btn.sec {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line);
    }
    button.btn.sec:hover { background: var(--surface-2); border-color: var(--ink); }
    .status { margin-top: 9px; font-size: 11.5px; color: var(--muted); min-height: 15px; }
    .links {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .links .author { font-size: 11px; color: var(--muted); font-weight: 500; }
    .ico-bar { display: flex; align-items: center; gap: 6px; }
    .ico-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }
    .ico-btn:hover { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
    .ico-btn svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="top">
    <div style="display:flex;align-items:center;gap:9px">
      <img src="../icons/icon48.png" alt="" style="width:28px;height:28px;border-radius:7px;flex:none">
      <div class="brand">
        <span class="eyebrow">Open Source · v2.2.0</span>
        <b>INSS Extractor by FonCK</b>
      </div>
    </div>
    <button id="btn-theme" class="theme-btn" type="button" title="Alternar tema Claro / Escuro">☾</button>
  </div>

  <p>Contratos renomeados (Empréstimos, RMC e RCC) e extrato completo desde 06/1994 direto em <b>Downloads/Contratos INSS/</b>.</p>

  <div class="actions">
    <button id="btn-open" class="btn" type="button">Abrir painel no Meu INSS</button>
    <button id="btn-go" class="btn sec" type="button">Ir para meu.inss.gov.br</button>
    <button id="btn-welcome" class="btn sec" type="button">Guia de Boas-Vindas &amp; Consultoria</button>
  </div>

  <div id="status" class="status"></div>

  <div class="links">
    <span class="author">por Gabriel Fonseca</span>
    <div class="ico-bar">
      <a id="lnk-site" class="ico-btn" href="#" target="_blank" rel="noopener" title="Site Oficial" aria-label="Site Oficial">

      </a>
      <a id="lnk-github" class="ico-btn" href="#" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </a>
      <a id="lnk-linkedin" class="ico-btn" href="#" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
      <a id="lnk-whats" class="ico-btn" href="#" target="_blank" rel="noopener" title="Consultoria WhatsApp" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.03 2C6.51 2 2.04 6.47 2.04 11.98c0 1.76.46 3.48 1.34 5L2 22l5.15-1.35a9.95 9.95 0 0 0 4.88 1.27h.01c5.51 0 9.99-4.47 9.99-9.98A9.98 9.98 0 0 0 12.03 2Zm5.82 14.12c-.25.7-1.43 1.34-1.99 1.42-.51.08-1.16.11-1.88-.12-.44-.14-1-.33-1.72-.64-3.02-1.3-4.99-4.35-5.14-4.55-.15-.2-1.23-1.63-1.23-3.11 0-1.48.78-2.21 1.05-2.51.28-.3.6-.38.8-.38h.58c.19 0 .44-.07.68.52.25.6.85 2.08.93 2.23.07.15.12.33.02.53-.1.2-.15.32-.3.5-.15.17-.31.39-.45.52-.15.15-.3.31-.13.61.18.3.78 1.29 1.68 2.09 1.15 1.03 2.13 1.35 2.43 1.5.3.15.48.12.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.28.1 1.76.83 2.06.98.3.15.5.22.58.35.07.12.07.72-.18 1.42Z"/></svg>
      </a>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
